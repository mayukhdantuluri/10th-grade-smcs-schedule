<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHS SMCS 2029 - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Roboto', sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #ff1a1a; text-shadow: 0 0 10px rgba(255,0,0,0.5); margin-bottom: 20px; text-align: center; }
        .card { background: #161616; border: 2px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #ff4d4d; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; font-family: inherit; }
        textarea { height: 80px; resize: vertical; }
        button { background: #b80d19; color: #fff; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; box-shadow: 0 4px 12px rgba(184,13,25,0.5); transition: background 0.2s; }
        button:hover { background: #d91422; }
        .announcement-box { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        #status { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>SMCS Admin Dashboard</h1>

    <div class="card">
        <label>GitHub Personal Access Token (Saved in browser):</label>
        <input type="password" id="patToken" placeholder="Paste your GitHub token here...">
    </div>

    <div class="card" id="editorSection">
        <h3>Announcements</h3>
        <div id="announcementsContainer"></div>

        <h3>Block X Members (One per line)</h3>
        <textarea id="blockXInput"></textarea>

        <h3>Block Y Members (One per line)</h3>
        <textarea id="blockYInput"></textarea>

        <button onclick="saveChanges()">Save Changes to GitHub</button>
        <div id="status"></div>
    </div>

<script>
    const REPO = "mayukhdantuluri/10th-grade-smcs-schedule";
    const FILE_PATH = "data.json";

    // Load saved token on startup
    const tokenInput = document.getElementById("patToken");
    if(localStorage.getItem("gh_token")) {
        tokenInput.value = localStorage.getItem("gh_token");
        loadData();
    }

    tokenInput.addEventListener("input", () => {
        localStorage.setItem("gh_token", tokenInput.value);
        if(tokenInput.value.length > 10) loadData();
    });

    async function loadData() {
        try {
            let res = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`);
            let json = await res.json();
            let content = JSON.parse(decodeURIComponent(escape(atob(json.content))));

            // Populate Announcements
            let annHTML = "";
            content.announcements.forEach((ann, i) => {
                annHTML += `
                    <div class="announcement-box">
                        <label>Title ${i+1}:</label>
                        <input type="text" class="ann-title" value="${ann.title}">
                        <label>Detail ${i+1}:</label>
                        <textarea class="ann-detail">${ann.detail}</textarea>
                    </div>
                `;
            });
            document.getElementById("announcementsContainer").innerHTML = annHTML;

            // Populate Members
            document.getElementById("blockXInput").value = content.blockXMembers.join("\n");
            document.getElementById("blockYInput").value = content.blockYMembers.join("\n");
        } catch (e) {
            console.error(e);
        }
    }

    async function saveChanges() {
        let token = tokenInput.value.trim();
        let status = document.getElementById("status");
        if (!token) { alert("Please enter your GitHub Token!"); return; }

        status.style.color = "#ffaa00";
        status.textContent = "Saving changes to GitHub...";

        // Gather data from inputs
        let announcements = [];
        let titles = document.querySelectorAll(".ann-title");
        let details = document.querySelectorAll(".ann-detail");
        for(let i=0; i<titles.length; i++) {
            announcements.push({ title: titles[i].value, detail: details[i].value });
        }

        let blockXMembers = document.getElementById("blockXInput").value.split("\n").map(s => s.trim()).filter(Boolean);
        let blockYMembers = document.getElementById("blockYInput").value.split("\n").map(s => s.trim()).filter(Boolean);

        let newData = { announcements, blockXMembers, blockYMembers };

        try {
            // 1. Get current file SHA
            let getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                headers: { "Authorization": `token ${token}` }
            });
            let getJson = await getRes.json();
            let sha = getJson.sha;

            // 2. Push update
            let encodedContent = btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2))));
            let putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: "Update schedule data via Admin Dashboard",
                    content: encodedContent,
                    sha: sha
                })
            });

            if(putRes.ok) {
                status.style.color = "#00ff66";
                status.textContent = "Successfully saved! Changes will reflect live in 1 minute.";
            } else {
                let err = await putRes.json();
                throw new Error(err.message);
            }
        } catch (e) {
            status.style.color = "#ff3333";
            status.textContent = "Error: " + e.message;
        }
    }

    if(tokenInput.value) loadData();
</script>
</body>
</html>
